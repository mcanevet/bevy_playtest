name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  # Line tables only: keeps rlibs small (full debuginfo made each Bevy
  # rlib 190-370 MB). Single job now, so cache-compat across jobs is
  # moot, but keeps local dev and CI flags aligned.
  RUSTFLAGS: "-C debuginfo=line-tables-only"

jobs:
  # One job: everything the PR gate needs, sharing one Bevy build and
  # one cache restore. Contract coverage kept per-PR:
  #   - unit + fault-injection oracles (negative controls)
  #   - flagless `cargo test` UX pin (breakout)
  #   - battery tier, all 7 fixtures (playtest feature, plain cargo test)
  #   - release purity guard (zero bevy_playtest bytes in plain builds)
  #   - external-BRP acceptance, all 7 fixtures (inline, was the
  #     7-way test matrix: 5s tests don't justify a job class)
  #   - clippy -D warnings, fmt, rustdoc
  ci:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      # Actions pinned to full commit SHAs (mutable major tags are a
      # supply-chain risk).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Reclaim disk before building: the stock image ships ~9 GB of
      # Android SDK and ~3 GB of .NET we never touch.
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL

      - name: Install Rust
        uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          components: clippy, rustfmt

      # azure.archive.ubuntu.com periodically serves archives at ~60kB/s
      # (actions/runner-images#14823, #15040); apt has no
      # minimum-throughput failover, so a trickling transfer hangs for
      # 10-20 min. Prefer the public archive and bound each attempt so
      # a slow node fails fast and retries.
      - name: Install Linux dependencies (bevy backends + software Vulkan)
        run: |
          # Put archive.ubuntu.com ahead of the Azure mirror (both the
          # classic sources.list and the apt-mirrors.txt failover list).
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
            # Deduplicate, keeping the first occurrence of each mirror.
            sudo awk '!seen[$0]++' /etc/apt/apt-mirrors.txt \
              | sudo tee /etc/apt/apt-mirrors.txt.tmp >/dev/null
            sudo mv /etc/apt/apt-mirrors.txt.tmp /etc/apt/apt-mirrors.txt
          fi
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            if sudo timeout 180 apt-get $APT_OPTS update -yq && \
               sudo timeout 180 apt-get $APT_OPTS install -yq --no-install-recommends \
                 libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
                 mesa-vulkan-drivers; then
              exit 0
            fi
            echo "apt attempt $i failed or timed out; retrying" >&2
          done
          exit 1

      - name: Generate fixtures from pinned Bevy revision
        run: ./scripts/fetch_bevy_examples.sh

      # Restore the shared target/ cache (exact key or closest
      # fallback).
      - name: Restore target cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # Both workspaces share ONE physical target dir
          # (.cargo/config.toml), so one path covers everything.
          path: target/
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-lld
          restore-keys: |
            ${{ runner.os }}-target-

      # Format check: near-free (no compile), prevents drift merging.
      - name: Format check
        run: cargo fmt --all --check

      # Build everything ONCE with --all-features, then run all test
      # suites against the same artifacts. This avoids recompiling Bevy
      # for each test step (the old flow built with --features brp, then
      # unit tests demanded --all-features, forcing a full rebuild).
      - name: Build everything
        run: |
          cargo test --manifest-path fixtures/Cargo.toml --workspace --no-run
          cargo test --locked --features brp --no-run
          cargo test --locked --workspace --all-features --lib --tests --no-run

      # UX pin: plain `cargo test` on breakout must activate the
      # playtest feature and run the battery (not ignore it).
      - name: UX pin (flagless breakout cargo test)
        run: |
          set -o pipefail
          timeout 300 cargo test --manifest-path fixtures/breakout/Cargo.toml \
            | tee /tmp/breakout_flagless.log
          ! grep -Eq "[1-9][0-9]* ignored" /tmp/breakout_flagless.log

      # Negative controls: prove the oracles DETECT the violations they
      # claim to catch. Uses the already-built artifacts.
      - name: Fault-injection oracle tests
        run: cargo test --locked --test fault_injection

      # Full unit + integration battery (skips acceptance tests that
      # need fixture binaries; those run inline below). Uses cached
      # artifacts from the "Build everything" step.
      - name: Workspace unit tests
        run: >
          cargo test --locked --workspace --all-features --lib --tests --
          --skip fixtures_run_under_external_brp

      # Battery tier for ALL fixtures (playtest feature). The
      # self-dev-dependency pattern activates `playtest` only for test
      # builds; these binaries were already built above.
      - name: Battery tier (cargo test, all fixtures)
        run: |
          timeout 480 cargo test --manifest-path fixtures/Cargo.toml --workspace --features playtest --test playtest -- --test-threads=1

      # Release-purity guard: plain bin builds must NOT resolve
      # bevy_playtest. This is a cargo check + tree walk, not a rebuild.
      - name: Release purity guard (feature-off bin build)
        run: |
          cargo check --manifest-path fixtures/breakout/Cargo.toml
          if cargo tree --manifest-path fixtures/breakout/Cargo.toml -e normal \
              | grep -q 'bevy_playtest v'; then
            echo "ERROR: bevy_playtest resolved in a plain bin build (feature leak)" >&2
            exit 1
          fi

      # External-BRP acceptance: drive the feature-enabled fixture
      # binaries over BRP. Binaries were built in the "Build everything"
      # step; no recompilation here.
      - name: External-BRP acceptance (all fixtures)
        env:
          WGPU_BACKEND: vulkan
        run: |
          set -e
          for fixture in alien_cake_addict breakout contributors desk_toy game_menu loading_screen mines; do
            echo "=== BRP acceptance: $fixture"
            BEVY_PLAYTEST_FIXTURE=$fixture \
              timeout 120 cargo test --locked --test acceptance -- --exact fixtures_run_under_external_brp --nocapture
          done

      # Pointer tier: the synthetic_pointer bot clicks the real
      # game_menu UI through the picking chain. The fixture bin must
      # be built WITH the playtest feature (the self-dev-dependency
      # only activates it for test builds, not bins).
      - name: Pointer acceptance (synthetic_pointer bot)
        env:
          WGPU_BACKEND: vulkan
        run: |
          cargo build --manifest-path fixtures/game_menu/Cargo.toml --bin fixture_game_menu --features playtest
          cargo test --locked --all-features --test pointer_acceptance -- --test-threads=1

      # Clippy reuses the artifacts compiled above.
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Doc build: cheap (--no-deps documents only this crate, ~4s warm).
      - name: Doc build (deny rustdoc warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --all-features

      # Save the cache so future runs (including PR runs restoring via
      # restore-keys) hit the exact key. Skipped silently when the entry
      # already exists, so routine runs cost nothing here.
      - name: Save target cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target/
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-lld
