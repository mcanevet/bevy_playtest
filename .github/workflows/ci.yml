name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  # Debuginfo is set in Cargo.toml profiles (line tables for our crate,
  # none for dependencies). Do NOT set RUSTFLAGS debuginfo here: it
  # would override the per-package profile for every crate.

# Jobs: lint, fixtures and test-build run in parallel; test (3
# partitions) runs the archive test-build produces. `ci` aggregates
# them so the branch-protection required check stays a single stable
# name.
#
# Caching (Swatinem/rust-cache): one cache per job, saved ONLY from
# main. It keeps dependency artifacts and prunes this repo's own
# crates, test binaries and anything no longer in Cargo.lock, so the
# cache stays at a few GB instead of growing without bound (the old
# hand-rolled `target/` cache reached 10.5 GB and took ~8 min to
# restore). PR runs read main's cache but never write, so they don't
# evict it from the 10 GB repo quota.
#
# Tests run under cargo-nextest: one process per test, so the
# process-global `run_scenario` exclusivity (tests/common::run_slot)
# no longer forces subprocess-heavy suites to run one at a time.
jobs:
  # fmt, clippy, rustdoc, feature-combination check. Check-only build
  # (rmeta), so it has its own small cache.
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      # Actions pinned to full commit SHAs (mutable major tags are a
      # supply-chain risk).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Format check
        run: cargo fmt --all --check

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # Feature-combination guard: the documented minimal in-process
      # configuration must stay compilable. The state-digest module uses
      # bevy_ecs::reflect unconditionally, so this pins that the explicit
      # `bevy_reflect` feature on bevy_ecs (Cargo.toml) is never dropped
      # and the in-process-only build path cannot regress silently
      # (the --all-features gate alone would not catch it).
      - name: Feature combination guard (no-default-features in-process)
        run: cargo check --locked --no-default-features --features in-process

      # Doc build: cheap (--no-deps documents only this crate).
      - name: Doc build (deny rustdoc warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --all-features

  # Unit + integration tests of the harness itself, including the
  # fault-injection negative controls (tests/it/fault_injection.rs).
  # Built ONCE here and archived; `test` runs the archive in
  # partitions on parallel runners (the discovery suites alone are
  # ~16 min of serialized subprocess work).
  test-build:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build and archive tests
        run: >
          cargo nextest archive --locked --workspace --all-features --lib --tests
          --archive-file nextest-archive.tar.zst

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          retention-days: 1

  test:
    needs: test-build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Runtime deps only (no build here): skip the disk cleanup.
      - uses: ./.github/actions/setup
        with:
          free-disk: "false"

      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive

      # count:k/N deals tests round-robin, so the serialized discovery
      # tests spread evenly over the partitions.
      #
      # Extract INTO the checkout: tests locate the demo games via
      # env!("CARGO_BIN_EXE_*"), an absolute path baked in at build
      # time. The archive's root is `target/`, and every job checks out
      # to the same path, so extracting here restores those paths.
      - name: Workspace tests (nextest, partition ${{ matrix.partition }}/3)
        run: >
          cargo nextest run --archive-file nextest-archive.tar.zst
          --extract-to . --extract-overwrite --workspace-remap .
          --partition count:${{ matrix.partition }}/3 --profile ci

  # The consumer-facing contract, exercised on real Bevy games
  # generated from the pinned upstream revision.
  fixtures:
    runs-on: ubuntu-26.04
    # 45m covered the cargo-only tier. The Bazel battery tier adds a
    # COLD graph build (581 crates) the first time a cache key is new;
    # warm runs stay unaffected (single-digit-minute Bazel battery).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest

      - name: Generate fixtures from pinned Bevy revision
        run: ./scripts/fetch_bevy_examples.sh

      # --- Bazel battery tier (8 single-crate fixtures) -------------------
      # The fixtures' source dirs are generated by the fetch step ABOVE
      # (only tests/ and BUILD.bazel are committed), so Bazel analysis
      # depends on that step having run. The disk cache is a
      # content-addressed artifact store: a warm cache reduces the
      # battery tier to ~1-3m of test execution.

      - name: Install Bazelisk (pinned)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sfL --retry 3 \
            -o "$HOME/.local/bin/bazel" \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.30.0/bazelisk-linux-amd64
          echo "a248ae2b2b62b5baebb748f6fba7203bff1a27e5d01b55399a8406744cb539e8  $HOME/.local/bin/bazel" | sha256sum -c -
          chmod +x "$HOME/.local/bin/bazel"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bazel" --version

      # Restore the Bazel disk cache as a hash-keyed snapshot: a new
      # key on Bazel-layer changes (MODULE.bazel, .bazelrc, BUILD
      # files, toolchain) restores nothing; the run rebuilds and
      # saves a new coherent snapshot. LRU eviction handles growth
      # across snapshots, and a stale cache never overlays a
      # different Bazel configuration.
      - name: Restore Bazel disk cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/share/bazel-disk-cache
          key: ${{ runner.os }}-bazel-disk-cache-${{ hashFiles('MODULE.bazel', '.bazelrc', '**/BUILD.bazel', 'bazel-support/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-bazel-disk-cache-

      # battery targets carry size = "large" (900s deadline each); on
      # llvmpipe (software Vulkan) the 8 fixtures together need the
      # headroom. --test-threads=1: the libtest harness shares one
      # process, and loading_screen's test mutates env via unsafe
      # set_var (nextest's process isolation does not apply here).
      - name: Battery tier (Bazel, 8 fixtures)
        run: |
          df -h /
          bazel test --test_output=errors --test_arg=--test-threads=1 //fixtures:playtest_battery

      - name: Save Bazel disk cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: github.ref == 'refs/heads/main'
        with:
          path: ~/.local/share/bazel-disk-cache
          key: ${{ runner.os }}-bazel-disk-cache-${{ hashFiles('MODULE.bazel', '.bazelrc', '**/BUILD.bazel', 'bazel-support/Cargo.lock', 'rust-toolchain.toml') }}

      # Both workspaces share ONE physical target dir
      # (.cargo/config.toml). Listing both lets rust-cache prune the
      # members of each (fixture crates and bevy_playtest itself), so
      # regenerated fixtures never land on top of stale fixture
      # artifacts (the ENOSPC failure mode of 2026-10-31).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: fixtures
          workspaces: |
            fixtures -> ../target
            . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # fixtures/Cargo.lock records bevy_playtest's own version (it is a
      # path dependency), which every release-plz bump changes without
      # touching this lockfile. Rewrite ONLY that version line to the
      # crate's current version, so every fixture build below can stay
      # --locked: third-party pins remain enforced, and any other drift
      # still fails CI.
      - name: Sync bevy_playtest version in fixtures lockfile
        run: |
          v=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="bevy_playtest") | .version')
          sed -i "/^name = \"bevy_playtest\"\$/{n;s/^version = \".*\"\$/version = \"$v\"/}" fixtures/Cargo.lock
          git diff --stat fixtures/Cargo.lock

      # Prebuild everything the later cargo steps run: thetawave's
      # playtest battery (the 8 single-crate fixtures moved to the
      # Bazel tier above) and breakout's plain (flagless) test
      # targets, so the UX pin's 300 s timeout bounds the run only,
      # not compilation.
      - name: Build fixtures
        run: |
          cargo nextest run --locked --manifest-path fixtures/thetawave/Cargo.toml --features playtest --test playtest --no-run
          cargo test --locked --manifest-path fixtures/breakout/Cargo.toml --no-run

      # UX pin: plain `cargo test` on breakout must activate the
      # playtest feature and run the battery (not ignore it). Stays on
      # plain cargo on purpose: this is the command users type.
      - name: UX pin (flagless breakout cargo test)
        run: |
          set -o pipefail
          timeout 300 cargo test --locked --manifest-path fixtures/breakout/Cargo.toml \
            | tee /tmp/breakout_flagless.log
          ! grep -Eq "[1-9][0-9]* ignored" /tmp/breakout_flagless.log

      # Battery tier for thetawave ONLY (playtest feature): the
      # multi-crate fork port deliberately stays cargo-native — see
      # fixtures/BUILD.bazel. nextest isolates each test in its own
      # process, which satisfies run_scenario's one-run-per-process
      # exclusivity.
      - name: Battery tier (cargo, thetawave)
        run: |
          timeout 600 cargo nextest run --locked --manifest-path fixtures/thetawave/Cargo.toml --features playtest --test playtest --profile ci --config-file .config/nextest.toml

      # Release-purity guard: plain bin builds must NOT resolve
      # bevy_playtest. This is a cargo check + tree walk, not a rebuild.
      - name: Release purity guard (feature-off bin build)
        run: |
          cargo check --manifest-path fixtures/breakout/Cargo.toml
          if cargo tree --manifest-path fixtures/breakout/Cargo.toml -e normal \
              | grep -q 'bevy_playtest v'; then
            echo "ERROR: bevy_playtest resolved in a plain bin build (feature leak)" >&2
            exit 1
          fi

  # Single required status check for branch protection. Fails unless
  # every job above succeeded (a skipped or cancelled job is a failure).
  ci:
    if: always()
    needs: [lint, test-build, test, fixtures]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || exit 1
          done
