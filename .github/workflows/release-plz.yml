name: release-plz

on:
  push:
    branches: [main]

env:
  CARGO_INCREMENTAL: 0

jobs:
  # Publish unpublished packages (fires when the release PR merges).
  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-latest
    permissions:
      # Push tags and create releases.
      contents: write
      # Detect the release PR and its commits.
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99"
      - name: Install Linux dependencies
        # semver-checks / cargo doc build wayland-sys, which needs
        # pkg-config + libwayland-dev to compile.
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yq --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Run release-plz
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Open/update a PR with the new versions and changelog.
  release-plz-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    permissions:
      # Push to the pull request branch.
      contents: write
      # Create and update pull requests.
      pull-requests: write
    concurrency:
      # Serialized per branch so PR updates never conflict.
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99"
      - name: Install Linux dependencies
        # semver-checks / cargo doc build wayland-sys, which needs
        # pkg-config + libwayland-dev to compile.
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yq --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Run release-plz
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Not needed for crates.io; required for private registries.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
