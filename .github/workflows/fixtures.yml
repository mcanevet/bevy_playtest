name: Fixtures (Matrix)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: fixtures-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  # Line tables only (no full DWARF types/variables): llvm-cov needs
  # line tables for accurate coverage, full debuginfo costs gigabytes
  # the runners don't have (debug build of Bevy alone is ~19 GB).
  # NOTE: must match across build and test jobs so caches are compatible.
  # Also applies to the MSRV job (1.97.1) — the flag predates it.
  RUSTFLAGS: "-C debuginfo=line-tables-only"

jobs:
  # Single build job: generates fixtures, builds everything (including
  # test binaries), saves one shared cache entry. Matrix legs restore it.
  build:
    # ubuntu-26.04: validated in PR #10 (stock rust-lld works; the old
    # bfd fallback was a 24.04 SIGBUS workaround, now dropped). Keeping
    # the explicit version (not ubuntu-latest) for reproducibility;
    # Renovate manages bumps via the github-runners datasource.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      # Actions pinned to full commit SHAs (mutable major tags are a
      # supply-chain risk).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Reclaim disk before building: the stock image ships ~9 GB of
      # Android SDK and ~3 GB of .NET we never touch, and a debug build
      # of Bevy exceeds the ~14 GB free by itself. Inlined (rather than
      # jlumbroso/free-disk-space) to avoid another unpinned third-party
      # action; reports per-path sizes so a silent layout change (a
      # MISSING line) is visible in logs.
      - name: Free disk space
        run: |
          df -h / | tee /tmp/df-before.txt
          for p in /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL; do
            if [ -e "$p" ]; then
              sudo du -sh "$p" || true
              sudo rm -rf "$p"
            else
              echo "MISSING (image layout changed?): $p"
            fi
          done
          echo "--- after cleanup ---"
          df -h /
          free -h || true
          gcc --version | head -1
          ld --version | head -1
          ld.lld --version 2>/dev/null | head -1 || echo "ld.lld not present"

      # Install the exact toolchain named in rust-toolchain.toml.
      # Pinned to the 1.99.0 branch for reproducibility.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies (bevy backends + software Vulkan)
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yq --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            mesa-vulkan-drivers

      - name: Generate fixtures from pinned Bevy revision
        run: ./scripts/fetch_bevy_examples.sh

      - name: Cache target directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # Both workspaces share ONE physical target dir
          # (.cargo/config.toml), so one path covers everything.
          # Key includes the toolchain and linker flags: cargo
          # fingerprints embed the rustc version and RUSTFLAGS, so a
          # toolchain bump must rotate the entry or every job silently
          # degrades to a full rebuild (which, on an exact-key hit,
          # would also never re-save).
          path: target/
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-lld
          restore-keys: |
            ${{ runner.os }}-target-

      - name: Build fixture workspace (all games + runner)
        run: cargo build --locked --manifest-path fixtures/Cargo.toml --workspace

      - name: Pre-compile acceptance tests (no run)
        run: cargo test --locked --features brp --no-run

      # Quality gates: enforce the same fmt/clippy the maintainers run
      # locally, so drift cannot merge.
      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Doc build (deny rustdoc warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --all-features

      # Negative controls: prove the oracles DETECT the violations they
      # claim to (NaN, bounds, frozen world, panic, error log). Fast
      # (<1s); belongs in the build job, not per-fixture legs.
      - name: Fault-injection oracle tests
        run: cargo test --locked --test fault_injection

      # Full unit + integration battery (fast, no fixtures needed).
      - name: Workspace unit tests
        run: cargo test --locked --workspace --all-features --lib --tests

      # Coverage: measure line coverage and upload to Codecov (public repo
      # needs no token). Threshold: 80% lines covered.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: |
          cargo llvm-cov --locked --workspace --all-features --lcov --output-path lcov.info

      # Tokenless uploads only work for unprotected branches; main
      # requires a token even on public repos. Set CODECOV_TOKEN as a
      # repo secret (Codecov repo Settings -> Configuration).
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # MSRV: the harness crate's floor is set by its highest bevy_* dep
  # (bevy 0.20 requires rustc 1.97.1). Verify the declared floor
  # still compiles so users on older toolchains are not broken
  # silently. Uses cargo check (fast) — the full battery runs on the
  # current toolchain.
  msrv:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master: adds toolchain input
        with:
          toolchain: 1.99.1

      - name: Install Linux dependencies (bevy backends + software Vulkan)
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yq --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            mesa-vulkan-drivers

      # Check without --locked: the committed lockfile is resolved for
      # the newest toolchain; MSRV compatibility of locked dep versions
      # is a semver question best caught at publish time. MSRV check
      # verifies the crate's own code compiles on the declared floor.
      # `cargo +1.97.1` bypasses the repo's rust-toolchain.toml (which
      # rustup would otherwise honor in this directory).
      - name: cargo check on MSRV
        run: cargo +1.97.1 check -p bevy_playtest --all-features

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: build
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - alien_cake_addict
          - breakout
          - contributors
          - desk_toy
          - game_menu
          - loading_screen
          - mines

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0

      - name: Install Linux dependencies (bevy backends + software Vulkan)
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yq --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            mesa-vulkan-drivers

      - name: Generate fixtures from pinned Bevy revision
        run: ./scripts/fetch_bevy_examples.sh

      - name: Restore shared build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # Both workspaces share ONE physical target dir
          # (.cargo/config.toml), so one path covers everything.
          path: target/
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-lld
          restore-keys: |
            ${{ runner.os }}-target-
          # Explicitly declare read-only mode for PR safety; the build
          # job owns the write path.
          cache-mode: read-only

      # The cache restores all dependency artifacts (incl. Bevy);
      # only the small fixture crates themselves rebuild here.
      - name: Build fixture binaries
        run: >
          cargo build --locked --manifest-path fixtures/Cargo.toml
          -p fixture_${{ matrix.fixture }} --bins

      # No xvfb: PlaytestPlugin's runner swap (last-set-wins) means
      # nothing opens a display; Lavapipe renders via Vulkan without
      # X (same as wgpu's own Linux CI).
      - name: In-process tier (headless, real game logic)
        env:
          WGPU_BACKEND: vulkan
        run: >
          printf '%s' '{"name":"ci","bot":{"type":"chaos","seed":42},"duration_s":2.0,"invariants":[],"setup":{}}' > /tmp/sc.json &&
          BEVY_PLAYTEST_SCENARIO=/tmp/sc.json
          timeout 300 ./target/debug/fixture_${{ matrix.fixture }}

      - name: External-BRP tier (bin driven over BRP)
        env:
          BEVY_PLAYTEST_FIXTURE: ${{ matrix.fixture }}
          WGPU_BACKEND: vulkan
        run: cargo test --locked --features brp --test acceptance -- --nocapture
