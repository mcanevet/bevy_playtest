name: Fixtures (Matrix)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: fixtures-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  # Line tables only: llvm-cov needs line tables for accurate coverage,
  # full debuginfo costs gigabytes the runners don't have. Must match
  # across all jobs so the cache is compatible.
  RUSTFLAGS: "-C debuginfo=line-tables-only"

jobs:
  # Critical path: generate fixtures, restore cache, build everything,
  # upload binaries as artifacts for the test matrix legs.
  build:
    # ubuntu-26.04: validated in PR #10 (stock rust-lld works; the old
    # bfd fallback was a 24.04 SIGBUS workaround, now dropped). Keeping
    # the explicit version (not ubuntu-latest) for reproducibility;
    # Renovate manages bumps via the github-runners datasource.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      # Actions pinned to full commit SHAs (mutable major tags are a
      # supply-chain risk).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Reclaim disk before building: the stock image ships ~9 GB of
      # Android SDK and ~3 GB of .NET we never touch. Reports per-path
      # sizes so a silent image-layout change (a MISSING line) shows.
      - name: Free disk space
        run: |
          df -h / | tee /tmp/df-before.txt
          for p in /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL; do
            if [ -e "$p" ]; then
              sudo du -sh "$p" || true
              sudo rm -rf "$p"
            else
              echo "MISSING (image layout changed?): $p"
            fi
          done
          echo "--- after cleanup ---"
          df -h /

      - name: Install Rust
        uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies (bevy backends + software Vulkan)
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yq --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            mesa-vulkan-drivers

      - name: Generate fixtures from pinned Bevy revision
        run: ./scripts/fetch_bevy_examples.sh

      # Restore the shared target/ cache (exact key or closest
      # fallback). Test legs do NOT touch this cache — they download
      # the fixture-binary artifact instead.
      - name: Restore target cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # Both workspaces share ONE physical target dir
          # (.cargo/config.toml), so one path covers everything.
          path: target/
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-lld
          restore-keys: |
            ${{ runner.os }}-target-

      # Build the whole fixture workspace (fills the cache with every
      # fixture's exact fingerprints) plus the acceptance test binary.
      - name: Build fixture workspace + acceptance tests
        run: |
          cargo build --locked --manifest-path fixtures/Cargo.toml --workspace
          cargo test --locked --features brp --no-run

      # Ship ONLY the 7 played fixture binaries + the acceptance test
      # binary to the legs (tens of MB, seconds to download). The
      # _pristine twins are never executed in CI — dead weight, skipped.
      - name: Upload fixture binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fixture-binaries
          path: |
            target/debug/fixture_alien_cake_addict
            target/debug/fixture_breakout
            target/debug/fixture_contributors
            target/debug/fixture_desk_toy
            target/debug/fixture_game_menu
            target/debug/fixture_loading_screen
            target/debug/fixture_mines
            target/debug/deps/acceptance-*
          retention-days: 1
          if-no-files-found: error

      # Save the cache so future runs (including PR runs restoring via
      # restore-keys) hit the exact key. Skipped silently when the entry
      # already exists, so routine runs cost nothing here.
      - name: Save target cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target/
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-lld

  # Quality gates, off the critical path: run in parallel with test
  # legs rather than gating them.
  lint:
    name: lint (fmt/clippy/doc)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies (bevy backends + software Vulkan)
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yq --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            mesa-vulkan-drivers

      - name: Generate fixtures from pinned Bevy revision
        run: ./scripts/fetch_bevy_examples.sh

      - name: Restore target cache (read-only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target/
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-lld
          restore-keys: |
            ${{ runner.os }}-target-
          cache-mode: read-only

      # Same quality gates as before, so drift cannot merge.
      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Doc build (deny rustdoc warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --all-features

  # Unit + fault-injection battery, parallel to lint and the legs.
  unit:
    name: unit tests + fault injection
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0

      - name: Install Linux dependencies (bevy backends + software Vulkan)
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yq --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            mesa-vulkan-drivers

      - name: Generate fixtures from pinned Bevy revision
        run: ./scripts/fetch_bevy_examples.sh

      - name: Restore target cache (read-only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target/
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-lld
          restore-keys: |
            ${{ runner.os }}-target-
          cache-mode: read-only

      # Negative controls: prove the oracles DETECT the violations they
      # claim to catch. Fast (<1s).
      - name: Fault-injection oracle tests
        run: cargo test --locked --test fault_injection

      # Full unit + integration battery (fast, no fixtures needed).
      # Skip acceptance tests (require fixture binaries) — they run in the
      # test matrix legs.
      - name: Workspace unit tests
        run: |
          BEVY_PLAYTEST_FIXTURE="" cargo test --locked --workspace --all-features --lib --tests

  # Coverage: push to main only — PRs keep coverage off the feedback
  # loop entirely; main measures the trend.
  coverage:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0

      - name: Install Linux dependencies (bevy backends + software Vulkan)
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yq --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            mesa-vulkan-drivers

      - name: Generate fixtures from pinned Bevy revision
        run: ./scripts/fetch_bevy_examples.sh

      - name: Restore target cache (read-only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target/
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-lld
          restore-keys: |
            ${{ runner.os }}-target-
          cache-mode: read-only

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: |
          cargo llvm-cov --locked --workspace --all-features --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # Fixture matrix legs: no cache restore, no compilation — just
  # download the binaries the build job shipped and run them.
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: build
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - alien_cake_addict
          - breakout
          - contributors
          - desk_toy
          - game_menu
          - loading_screen
          - mines

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Runtime libraries only (no -dev packages, no Rust toolchain
      # needed for compilation): legs only execute prebuilt binaries.
      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yq --no-install-recommends \
            libasound2t64 libudev1 libxkbcommon0 libwayland-client0 \
            mesa-vulkan-drivers

      - name: Download fixture binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: fixture-binaries
          path: target/debug/

      # Make the played fixture binary executable; deps/ items arrive
      # executable already but chmod defensively.
      - name: Stage binaries
        run: |
          chmod +x target/debug/fixture_${{ matrix.fixture }}
          chmod +x target/debug/deps/acceptance-*
          ldd target/debug/fixture_${{ matrix.fixture }} | tee /tmp/ldd.txt
          grep -v "not found" /tmp/ldd.txt || true

      # In-process tier (headless, real game logic). No cargo needed —
      # run the shipped binary directly.
      - name: In-process tier (headless, real game logic)
        env:
          WGPU_BACKEND: vulkan
        run: >
          printf '%s' '{"name":"ci","bot":{"type":"chaos","seed":42},"duration_s":2.0,"invariants":[],"setup":{}}' > /tmp/sc.json &&
          BEVY_PLAYTEST_SCENARIO=/tmp/sc.json
          timeout 300 ./target/debug/fixture_${{ matrix.fixture }}

      # External-BRP tier: the acceptance binary embeds CARGO_MANIFEST_DIR
      # (repo root) and looks for target/debug/fixture_<name> — both
      # satisfied by checkout + artifact placement. Running it directly
      # avoids cargo rebuild entirely.
      - name: External-BRP tier (bin driven over BRP)
        env:
          BEVY_PLAYTEST_FIXTURE: ${{ matrix.fixture }}
          WGPU_BACKEND: vulkan
        run: |
          BIN=$(find target/debug/deps -maxdepth 1 -name 'acceptance-*' -perm -u+x | head -1)
          test -n "$BIN"
          "$BIN" --nocapture
