name: Setup Bevy CI runner
description: >
  Shared runner preparation for every CI job: install the pinned Rust
  toolchain (and only it), plus Bevy's Linux build/runtime dependencies
  (and software Vulkan for headless rendering).

runs:
  using: composite
  steps:
    # No disk cleanup: ubuntu-26.04 runners have ~117 GB free, and our
    # caches are < 1 GB per job. Deleting the preinstalled SDKs took
    # 1.5-6.6 min per job (and sat on the critical path).
    #
    # Single source of truth for the toolchain version: rust-toolchain.toml.
    # Install it EXPLICITLY (relying on rustup's auto-install is
    # deprecated), then uninstall every other toolchain: Swatinem/rust-cache
    # hashes ALL installed toolchains into its cache key, and some runner
    # images preinstall a stable toolchain while others don't, which made
    # the key (and so the cache) flip between runners.
    - name: Install the pinned Rust toolchain (only)
      shell: bash
      run: |
        set -euo pipefail
        # The pin comes from the file itself, never from `rustup show
        # active-toolchain` (RUSTUP_TOOLCHAIN or a directory override
        # would make that report something else).
        channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
        test -n "$channel"
        rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
        for t in $(rustup toolchain list | cut -d' ' -f1); do
          case "$t" in
            "$channel"-*) ;;
            *) rustup toolchain uninstall "$t" ;;
          esac
        done
        rustup toolchain list

    # azure.archive.ubuntu.com periodically serves archives at ~60kB/s
    # (actions/runner-images#14823, #15040); apt has no
    # minimum-throughput failover, so a trickling transfer hangs for
    # 10-20 min. Prefer the public archive and bound each attempt so
    # a slow node fails fast and retries.
    - name: Install Linux dependencies (bevy backends + software Vulkan)
      shell: bash
      run: |
        sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
          /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
        if [ -f /etc/apt/apt-mirrors.txt ]; then
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          # Deduplicate, keeping the first occurrence of each mirror.
          sudo awk '!seen[$0]++' /etc/apt/apt-mirrors.txt \
            | sudo tee /etc/apt/apt-mirrors.txt.tmp >/dev/null
          sudo mv /etc/apt/apt-mirrors.txt.tmp /etc/apt/apt-mirrors.txt
        fi
        APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
        for i in 1 2 3; do
          if sudo timeout 180 apt-get $APT_OPTS update -yq && \
             sudo timeout 180 apt-get $APT_OPTS install -yq --no-install-recommends \
               libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
               mesa-vulkan-drivers; then
            exit 0
          fi
          echo "apt attempt $i failed or timed out; retrying" >&2
        done
        exit 1
