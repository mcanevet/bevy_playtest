[package]
name = "bevy_playtest"
version = "0.5.0"
edition = "2021"
rust-version = "1.97"
description = "Playtesting harness for Bevy games: deterministic bot, oracles, headless takeover"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mcanevet/bevy_playtest"
readme = "README.md"
keywords = ["bevy", "gamedev", "testing", "playtest", "ci"]
categories = ["game-development", "development-tools::testing"]

[dependencies]
# Deliberately narrow: the residual-taint table promises the in-process tier
# only unifies bevy_ecs/app/transform/input into the consumer's graph.
bevy_app = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_reflect = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_transform = { version = "0.20.1", default-features = false, features = ["std", "bevy-support"] }
bevy_tasks = { version = "0.20.1", default-features = false }
bevy_time = { version = "0.20.1", default-features = false, features = ["std"] }
tracing = "0.1.44"
bevy_input = { version = "0.20.1", default-features = false, features = ["std", "keyboard", "mouse"] }
# Vec2 for cursor positions. Already in every consumer graph via bevy_input;
# a direct dependency only adds the type, no new crates.
bevy_math = { version = "0.20.1", default-features = false }
# Wrapped WindowEvent messages for cursor/button delivery: bevy_picking
# reads `bevy_window::WindowEvent` (what winit writes), not the raw
# bevy_input messages the harness writes, so pointer-driven games
# (bevy_ui picking) need the wrapped forms too. Core to both driving
# modes (mode parity), hence non-optional. default-features = false
# adds only bevy_window + raw-window-handle beyond the already-shared
# bevy_{app,ecs,input,math,reflect} set.
bevy_window = { version = "0.20.1", default-features = false }
# Bevy UI for the liveness oracle: watch Changed<UiTransform> in addition
# to Changed<Transform> so pure-UI games (Bevy 0.20 UI nodes carry
# UiTransform, not Transform) count as alive when they respond. Optional —
# in-process-only consumers who skip it keep the narrow dependency set.
# Under takeover the full `bevy` meta-crate is already in the graph, so
# enabling this there costs no extra crates (same-version unification).
bevy_ui = { version = "0.20.1", default-features = false, optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry", "fmt", "env-filter"] }
# PlaytestPlugin takeover: winit detection + headless plugin-group swap
bevy_winit = { version = "0.20.1", optional = true, default-features = false }
bevy = { version = "0.20.1", optional = true }

[[bin]]
name = "takeover_demo"
path = "src/bin/takeover_demo.rs"
required-features = ["takeover"]

[[bin]]
name = "takeover_demo_winit"
path = "src/bin/takeover_demo_winit.rs"
required-features = ["takeover"]

[[bin]]
name = "takeover_demo_stock"
path = "src/bin/takeover_demo_stock.rs"
required-features = ["takeover"]

[[bin]]
name = "takeover_demo_nondet"
path = "src/bin/takeover_demo_nondet.rs"
required-features = ["takeover"]

[[bin]]
name = "takeover_demo_default"
path = "src/bin/takeover_demo_default.rs"
required-features = ["takeover"]

# Input-delivery regression demo: world moves only on
# `just_pressed` under a DefaultPlugins-equivalent graph (see
# tests/input_delivery.rs).
[[bin]]
name = "takeover_demo_input"
path = "src/bin/takeover_demo_input.rs"
required-features = ["takeover"]

# Picking-delivery regression demo: world moves only on
# `PointerClick` under a picking-capable graph (see
# tests/input_delivery.rs).
[[bin]]
name = "takeover_demo_picking"
path = "src/bin/takeover_demo_picking.rs"
required-features = ["takeover"]

[features]
default = ["in-process", "takeover"]
in-process = []
takeover = ["in-process", "takeover-winit"]
takeover-winit = ["takeover", "dep:bevy_winit", "dep:bevy", "ui-liveness"]
# UI liveness oracle: extends frozen_world to Changed<UiTransform>. Free
# under takeover (bevy meta-crate already unifies bevy_ui), so default-on
# there; in-process-only consumers opt in explicitly.
ui-liveness = ["dep:bevy_ui"]

# Local dev speedup: line-tables-only debuginfo (fast link, much
# smaller target/ — full debuginfo made each Bevy rlib 190-370 MB).
# CI already sets the same flag via RUSTFLAGS.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[[bin]]
name = "takeover_demo_raw_winit"
path = "src/bin/takeover_demo_raw_winit.rs"
required-features = ["takeover"]

[[bin]]
name = "takeover_demo_transient"
path = "src/bin/takeover_demo_transient.rs"
required-features = ["takeover"]
[[bin]]
name = "takeover_demo_empty"
path = "src/bin/takeover_demo_empty.rs"
required-features = ["takeover"]
