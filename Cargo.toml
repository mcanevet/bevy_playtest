[package]
name = "bevy_playtest"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Playtesting harness for Bevy games: in-process driver, oracles, external BRP validation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mcanevet/bevy_playtest"
readme = "README.md"
keywords = ["bevy", "gamedev", "testing", "playtest", "ci"]
categories = ["game-development", "development-tools::testing"]

[dependencies]
# Deliberately narrow: the residual-taint table promises the in-process tier
# only unifies bevy_ecs/app/transform/input into the consumer's graph.
bevy_app = { version = "0.20.0", default-features = false, features = ["std"] }
bevy_reflect = { version = "0.20.0", default-features = false, features = ["std"] }
bevy_ecs = { version = "0.20.0", default-features = false, features = ["std"] }
bevy_transform = { version = "0.20.0", default-features = false, features = ["std", "bevy-support"] }
bevy_tasks = { version = "0.20.0", default-features = false }
bevy_time = { version = "0.20.0", default-features = false, features = ["std"] }
tracing = "0.1"
bevy_input = { version = "0.20.0", default-features = false, features = ["std", "keyboard"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry", "fmt"] }

# BRP client (brp feature)
async-io = { version = "2", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", optional = true, features = ["client", "http1"] }
smol-hyper = { version = "0.1", optional = true }
futures-lite = { version = "2", optional = true }

[features]
default = ["in-process"]
in-process = []
brp = [
    "dep:hyper",
    "dep:smol-hyper",
    "dep:async-io",
    "dep:http-body-util",
    "dep:futures-lite",
]
