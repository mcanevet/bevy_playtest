[package]
name = "bevy_playtest"
version = "0.8.0"
edition = "2021"
rust-version = "1.97"
description = "Playtesting harness for Bevy games: deterministic bot, oracles, headless takeover"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mcanevet/bevy_playtest"
readme = "README.md"
keywords = ["bevy", "gamedev", "testing", "playtest", "ci"]
categories = ["game-development", "development-tools::testing"]

[dependencies]
# Deliberately narrow: the residual-taint table promises the in-process tier
# only unifies bevy_ecs/app/transform/input into the consumer's graph.
bevy_app = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_reflect = { version = "0.20.1", default-features = false, features = ["std"] }
# bevy_ecs gets an explicit "bevy_reflect": the always-compiled state-digest
# module uses `bevy_ecs::reflect` (AppTypeRegistry, ReflectComponent).
# Today the feature is also enabled transitively via bevy_input/bevy_reflect,
# but the digest must not rely on another crate's feature wiring to compile.
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std", "bevy_reflect"] }
bevy_transform = { version = "0.20.1", default-features = false, features = ["std", "bevy-support"] }
bevy_tasks = { version = "0.20.1", default-features = false }
bevy_time = { version = "0.20.1", default-features = false, features = ["std"] }
tracing = "0.1.44"
bevy_input = { version = "0.20.1", default-features = false, features = ["std", "keyboard", "mouse", "gamepad"] }
# Vec2 for cursor positions. Already in every consumer graph via bevy_input;
# a direct dependency only adds the type, no new crates.
bevy_math = { version = "0.20.1", default-features = false }
# Wrapped WindowEvent messages for cursor/button delivery: bevy_picking
# reads `bevy_window::WindowEvent` (what winit writes), not the raw
# bevy_input messages the harness writes, so pointer-driven games
# (bevy_ui picking) need the wrapped forms too. Core to both driving
# modes (mode parity), hence non-optional. default-features = false
# adds only bevy_window + raw-window-handle beyond the already-shared
# bevy_{app,ecs,input,math,reflect} set.
bevy_window = { version = "0.20.1", default-features = false }
# Bevy UI for the liveness oracle: watch Changed<UiTransform> in addition
# to Changed<Transform> so pure-UI games (Bevy 0.20 UI nodes carry
# UiTransform, not Transform) count as alive when they respond. Optional —
# in-process-only consumers who skip it keep the narrow dependency set.
# Under takeover the full `bevy` meta-crate is already in the graph, so
# enabling this there costs no extra crates (same-version unification).
bevy_ui = { version = "0.20.1", default-features = false, optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry", "fmt", "env-filter"] }
# PlaytestPlugin takeover: winit detection + headless plugin-group swap
bevy_winit = { version = "0.20.1", optional = true, default-features = false }
bevy = { version = "0.20.1", optional = true }

[dev-dependencies]
# D1-d: the lw-reader tests read REAL Leafwing InputManager 0.22
# registrations (in-process App fixtures). Dev/test-only: consumers'
# graphs never see leafwing, even with `lw-reader` ON (the reader is
# pure reflection and works against any conforming registration).
leafwing-input-manager = "0.22"
# Register an engine resource (bevy_time::Time<Virtual>) as REFLECTED in
# the exclusion test: the harness's narrow bevy_time dep (no reflect)
# covers runtime use, but the test must prove the bevy_* filter drops a
# genuinely registered engine type. Dev-deps do not taint consumers.
bevy_time = { version = "0.20.1", features = ["bevy_reflect"] }
# Unmask system names in the TEST graph (bevy_utils/debug: without it
# `DebugName` displays a placeholder for every system). The static scan's
# ENGINE_DRIVER_NAMES filter is name-based, so the exact-count
# scan_purity tests need real names for the engine's exclusive drivers
# (Main/FixedMain runners, message_update_system); with names masked
# those drivers over-count every device class — fail-open, but the
# pinned counts assume this dep. Load-bearing for tests only:
# dev-deps never unify into the published crate's normal graph, so
# consumers keep masked names and degrade fail-open to over-counting.
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std", "debug"] }

[[bin]]
name = "takeover_demo"
path = "src/bin/takeover_demo.rs"
required-features = ["takeover"]

[[bin]]
name = "takeover_demo_winit"
path = "src/bin/takeover_demo_winit.rs"
required-features = ["takeover"]

[[bin]]
name = "takeover_demo_stock"
path = "src/bin/takeover_demo_stock.rs"
required-features = ["takeover"]

[[bin]]
name = "takeover_demo_nondet"
path = "src/bin/takeover_demo_nondet.rs"
required-features = ["takeover"]

[[bin]]
name = "takeover_demo_nondet_resource"
path = "src/bin/takeover_demo_nondet_resource.rs"
required-features = ["takeover"]

[[bin]]
name = "takeover_demo_default"
path = "src/bin/takeover_demo_default.rs"
required-features = ["takeover"]

# Input-delivery regression demo: world moves only on
# `just_pressed` under a DefaultPlugins-equivalent graph (see
# tests/input_delivery.rs).
[[bin]]
name = "takeover_demo_input"
path = "src/bin/takeover_demo_input.rs"
required-features = ["takeover"]

# Picking-delivery regression demo: world moves only on
# `PointerClick` under a picking-capable graph (see
# tests/input_delivery.rs).
[[bin]]
name = "takeover_demo_picking"
path = "src/bin/takeover_demo_picking.rs"
required-features = ["takeover"]

# Quadrant-clickable child for the mouse-GRID
# position-discrimination test: a UI node covering the top-left
# ~45% of the window (vs. `takeover_demo_picking`'s fullscreen
# node), so only grid cells overlapping the quadrant diverge —
# the fixture that catches a grid which finds clicks but cannot
# tell WHERE (see tests/discovery_flow.rs).
[[bin]]
name = "takeover_demo_mouse_quadrant"
path = "src/bin/takeover_demo_mouse_quadrant.rs"
required-features = ["takeover"]

# Minimal no-op child for probe-pool tests: runs, exits 0, never
# writes any file — the platform-neutral stand-in for "a game that
# exits without reporting" (see tests/probe_pool.rs,
# stale_report_cannot_masquerade_as_a_fresh_success).
[[bin]]
name = "takeover_demo_noop"
path = "src/bin/takeover_demo_noop.rs"
required-features = ["takeover"]

# Runaway child for probe-pool tests: never exits on its own — the
# watchdog-kills-a-stuck-game test needs a child GUARANTEED to still
# be alive at the 1s deadline on every machine (simulated-time demos
# are CPU-bound and machine-speed dependent; see the bin's module
# docs). See tests/probe_pool.rs:
# runaway_child_is_killed_by_the_wall_clock_watchdog.
[[bin]]
name = "takeover_demo_hang"
path = "src/bin/takeover_demo_hang.rs"
required-features = ["takeover"]

# Cwd/HOME-isolation child for probe-pool tests: writes one
# cwd-relative marker and one HOME-resolved marker, then exits —
# the regression test asserts both land in the pool's per-job
# throwaway directory. See tests/probe_pool.rs:
# probe_children_get_their_own_cwd_and_home.
[[bin]]
name = "takeover_demo_cwd_write"
path = "src/bin/takeover_demo_cwd_write.rs"
required-features = ["takeover"]

# Cwd/HOME-isolation child for the BATTERY's regression test: unlike
# the pool (whose workspace survives long enough to inspect), the
# battery's temp dir is RAII-removed before assertions run — so this
# child SELF-CHECKS its cwd and HOME (exit 0 = isolated, 2/3 =
# violation details on stderr) and the test asserts on the exit
# code. See tests/battery.rs:
# battery_child_runs_in_its_own_cwd_and_home.
[[bin]]
name = "takeover_demo_cwd_check"
path = "src/bin/takeover_demo_cwd_check.rs"
required-features = ["takeover"]

# GPU-panic crash child for the battery's diagnosis regression:
# prints bevy_render's exact GPU_NOT_FOUND_ERROR_MESSAGE (Linux arm,
# with the URL suffix) and exits 101 with no report — reproducing a
# GPU-less-host death WITHOUT a GPU-less host. See tests/battery.rs:
# gpu_panic_gets_named_failure_with_remediation.
[[bin]]
name = "takeover_demo_gpu_panic"
path = "src/bin/takeover_demo_gpu_panic.rs"
required-features = ["takeover"]

# Negative-control crash child for the battery's diagnosis
# regression: a GENERIC panic (no GPU marker substring) must keep
# the plain NoReport verdict — detection must never mask other
# failures. See tests/battery.rs:
# generic_panic_keeps_plain_no_report_failure.
[[bin]]
name = "takeover_demo_panic_generic"
path = "src/bin/takeover_demo_panic_generic.rs"
required-features = ["takeover"]

# Grandchild-holding-pipe child for the battery's bounded-drain
# regression, TIMEOUT path: spawns a grandchild that INHERITS its
# stderr (the battery's tee pipe) and parks, then parks forever —
# the watchdog kills the direct child, but the parked grandchild
# keeps the pipe's write end open, so the tee never observes EOF.
# The drain must detach after its grace window instead of joining
# forever. See tests/battery.rs: bounded_drain_survives_a_held_pipe.
[[bin]]
name = "takeover_demo_stderr_grandchild"
path = "src/bin/takeover_demo_stderr_grandchild.rs"
required-features = ["takeover"]

# Same shape as takeover_demo_stderr_grandchild, NORMAL path: the
# direct child exits 101 promptly while the parked grandchild keeps
# the tee pipe open — the exit-diagnosis verdict must still arrive
# bounded. See tests/battery.rs:
# held_pipe_does_not_block_exit_diagnosis.
[[bin]]
name = "takeover_demo_stderr_grandchild_exit"
path = "src/bin/takeover_demo_stderr_grandchild_exit.rs"
required-features = ["takeover"]

[[bin]]
name = "takeover_demo_raw_winit"
path = "src/bin/takeover_demo_raw_winit.rs"
required-features = ["takeover"]

[[bin]]
name = "takeover_demo_transient"
path = "src/bin/takeover_demo_transient.rs"
required-features = ["takeover"]

[[bin]]
name = "takeover_demo_empty"
path = "src/bin/takeover_demo_empty.rs"
required-features = ["takeover"]

# Discover a game's input surface: the authoring-time tier-0 sweep
# (see docs/how-to/discover-input-surface.md). Required-features
# gates match the other bins: takeover drives probe subprocesses.
[[bin]]
name = "bevy_playtest_discover"
path = "src/bin/bevy_playtest_discover.rs"
required-features = ["takeover"]

[features]
default = ["in-process", "takeover"]
in-process = []
takeover = ["in-process", "takeover-winit"]
takeover-winit = ["takeover", "dep:bevy_winit", "dep:bevy", "ui-liveness"]
# UI liveness oracle: extends frozen_world to Changed<UiTransform>. Free
# under takeover (bevy meta-crate already unifies bevy_ui), so default-on
# there; in-process-only consumers opt in explicitly.
ui-liveness = ["dep:bevy_ui"]

# Leafwing InputManager declared-binding reader + intent-tap
# (D1-d). Pure reflection: no leafwing dependency in this crate — the
# reader matches LW's registered type paths via AppTypeRegistry and
# walks InputMap/ActionState components reflectively (see
# src/discovery/lw.rs). OFF by default so the default build's
# dependency set is unchanged; ON in dev/test all-features runs and
# requested by the known_answer fixture's `playtest` feature.
lw-reader = []

# Local dev speedup: line-tables-only debuginfo (fast link, much
# smaller target/ — full debuginfo made each Bevy rlib 190-370 MB).
# CI already sets the same flag via RUSTFLAGS.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
