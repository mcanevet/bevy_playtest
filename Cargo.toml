[package]
name = "bevy_playtest"
version = "0.16.0"
edition = "2021"
rust-version = "1.97"
description = "Playtesting harness for Bevy games: deterministic bot, oracles, headless takeover"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mcanevet/bevy_playtest"
readme = "README.md"
keywords = ["bevy", "gamedev", "testing", "playtest", "ci"]
categories = ["game-development", "development-tools::testing"]

[dependencies]
# Deliberately narrow: the residual-taint table promises the in-process tier
# only unifies bevy_ecs/app/transform/input into the consumer's graph.
bevy_app = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_reflect = { version = "0.20.1", default-features = false, features = ["std"] }
# bevy_ecs gets an explicit "bevy_reflect": the always-compiled state-digest
# module uses `bevy_ecs::reflect` (AppTypeRegistry, ReflectComponent).
# Today the feature is also enabled transitively via bevy_input/bevy_reflect,
# but the digest must not rely on another crate's feature wiring to compile.
# `debug`: unmasked system/resource/component names (DebugName). Bevy's
# `debug` feature is OFF by default, so without this every name in a
# game under test reads as a placeholder and the state trace cannot
# name what changed. bevy_playtest only exists in test builds, so this
# never reaches a release build.
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std", "bevy_reflect", "debug"] }
# bevy_transform gets an explicit "bevy_reflect": the component_check
# oracle reads Transform leaves via reflection (the spatial fallback
# beside the selector component). Verified with `cargo tree`: enabling
# it does NOT widen the crate graph — bevy_reflect rides crates already
# unified by bevy_ecs/app/input (79 crates, before and after).
bevy_transform = { version = "0.20.1", default-features = false, features = ["std", "bevy-support", "bevy_reflect"] }
bevy_tasks = { version = "0.20.1", default-features = false }
bevy_time = { version = "0.20.1", default-features = false, features = ["std"] }
tracing = "0.1.44"
# log→tracing bridge: bevy's B000x hierarchy validators (and wgpu/
# naga/asset loaders/any `log`-crate user) emit through `log`, NOT
# `tracing`; the harness's capture subscriber must bridge them in or
# log_warn/log_error silently miss that whole ecosystem. Already in
# every consumer graph via bevy's bevy_log/bevy_app chain — a direct
# dependency adds the LogTracer type, no new crates.
tracing-log = "0.2"
bevy_input = { version = "0.20.1", default-features = false, features = ["std", "keyboard", "mouse", "gamepad"] }
# Vec2 for cursor positions. Already in every consumer graph via bevy_input;
# a direct dependency only adds the type, no new crates.
bevy_math = { version = "0.20.1", default-features = false }
# Wrapped WindowEvent messages for cursor/button delivery: bevy_picking
# reads `bevy_window::WindowEvent` (what winit writes), not the raw
# bevy_input messages the harness writes, so pointer-driven games
# (bevy_ui picking) need the wrapped forms too. Core to both driving
# modes (mode parity), hence non-optional. default-features = false
# adds only bevy_window + raw-window-handle beyond the already-shared
# bevy_{app,ecs,input,math,reflect} set.
bevy_window = { version = "0.20.1", default-features = false }
# Bevy UI for the liveness oracle: watch Changed<UiTransform> in addition
# to Changed<Transform> so pure-UI games (Bevy 0.20 UI nodes carry
# UiTransform, not Transform) count as alive when they respond. Optional —
# in-process-only consumers who skip it keep the narrow dependency set.
# Under takeover the full `bevy` meta-crate is already in the graph, so
# enabling this there costs no extra crates (same-version unification).
bevy_ui = { version = "0.20.1", default-features = false, optional = true }
# UI-surface enumeration (the `ui-surface` feature, src/discovery/
# ui_surface.rs): the enumeration mirrors a real game's UI stack —
# widget markers, picking, input focus, accessibility — so it needs
# the same crates `bevy_ui`'s picking path pulls in. All optional:
# consumers who skip the feature keep the narrow dependency set.
# `bevy_camera` has default = [] and `bevy_a11y`/`bevy_input_focus`
# need their defaults (bevy_reflect, async_executor) to register the
# reflected AccessibilityNode/InputFocus the enumeration reads;
# `bevy_picking` pulls bevy_asset/shape/window/mesh but the feature
# is already under takeover's unified `bevy` graph there.
bevy_ui_widgets = { version = "0.20.1", optional = true }
bevy_picking = { version = "0.20.1", optional = true }
bevy_camera = { version = "0.20.1", default-features = false, optional = true }
# Structural render-liveness rule (the `render-liveness` feature,
# src/discovery/render_liveness.rs): needs to probe for
# `bevy_render::RenderApp` (the sub-app whose presence distinguishes
# "renderer initialized, worth judging cameras" from "no render
# pipeline, not evaluated"). default-features = false keeps it
# renderer-only (no winit/GPU init). Under takeover the `bevy`
# meta-crate already unifies it — zero new crates there.
bevy_render = { version = "0.20.1", default-features = false, optional = true }
# Pixel-observed screen-liveness rule (the `screen-liveness`
# feature, src/discovery/screen_liveness.rs): spawns a harness-owned
# `Camera2d` rendering into an offscreen `Image` and reads pixels back
# via bevy_render's screenshot wire. Needs `Assets<Image>` +
# `Image`/`RenderAssetUsages` from bevy_asset/bevy_image — bevy_render
# does NOT re-export them — plus `Camera2d`/`RenderTarget` (already
# optional via bevy_camera). default-features = false on both; under
# takeover the `bevy` meta-crate already unifies all of them.
bevy_asset = { version = "0.20.1", default-features = false, optional = true }
bevy_image = { version = "0.20.1", default-features = false, optional = true }
bevy_input_focus = { version = "0.20.1", optional = true }
bevy_a11y = { version = "0.20.1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry", "fmt", "env-filter"] }
# PlaytestPlugin takeover: winit detection + headless plugin-group swap
bevy_winit = { version = "0.20.1", optional = true, default-features = false }
bevy = { version = "0.20.1", optional = true }

[dev-dependencies]
# log-crate bridge tests: emit events through `log` (the same wire
# protocol as bevy's B000x hierarchy validators) to prove the harness
# captures them. Dev/test-only: consumers' graphs never see it.
log = "0.4.35"
# Software-adapter detection for the screen_liveness GPU-positive
# tests: pixel CONTENT pins (live-vs-frozen tiers) are only
# meaningful on hardware rasterizers — lavapipe (DeviceType::Cpu)
# readback is content-unfaithful in both directions (a moving scene
# can hash identical; a static one can drift), so those tests
# self-skip on software adapters. Dev/test-only; same resolved
# wgpu-types already in the graph via bevy_render.
wgpu-types = "30.0.2"
# D1-d: the lw-reader tests read REAL Leafwing InputManager 0.22
# registrations (in-process App fixtures). Dev/test-only: consumers'
# graphs never see leafwing, even with `lw-reader` ON (the reader is
# pure reflection and works against any conforming registration).
leafwing-input-manager = "0.22"
# Register an engine resource (bevy_time::Time<Virtual>) as REFLECTED in
# the exclusion test: the harness's narrow bevy_time dep (no reflect)
# covers runtime use, but the test must prove the bevy_* filter drops a
# genuinely registered engine type. Dev-deps do not taint consumers.
bevy_time = { version = "0.20.1", features = ["bevy_reflect"] }
# GPU-positive screen_liveness tests: DefaultPlugins-minus-Winit app
# shape (real renderer, headless surface contract) + Sprite scenes,
# mirroring the T2 capture spike. Dev/test-only: consumers' graphs
# never see it (the spike proved the capture wire works under the
# `bevy` meta-crate's plugin graph).
bevy = "0.20.1"
# Unmask system names in the TEST graph (bevy_utils/debug: without it
# `DebugName` displays a placeholder for every system). The static scan's
# ENGINE_DRIVER_NAMES filter is name-based, so the exact-count
# scan_purity tests need real names for the engine's exclusive drivers
# (Main/FixedMain runners, message_update_system); with names masked
# those drivers over-count every device class — fail-open, but the
# pinned counts assume this dep. Load-bearing for tests only:
# dev-deps never unify into the published crate's normal graph, so
# consumers keep masked names and degrade fail-open to over-counting.
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std", "debug"] }
# Headless UI-layout bootstrap for the ui_surface tests: mirrors
# bevy_ui's own layout-test app (plugins + manual asset/resource
# init), which needs the text/asset/image/mesh stacks present
# without a GPU. Dev/test-only: consumers' graphs never see them.
bevy_text = "0.20.1"
bevy_asset = "0.20.1"
bevy_image = "0.20.1"
bevy_mesh = "0.20.1"
bevy_utils = "0.20.1"

[[bin]]
name = "takeover_demo"
path = "src/bin/takeover_demo.rs"
required-features = ["takeover"]

[[bin]]
name = "takeover_demo_winit"
path = "src/bin/takeover_demo_winit.rs"
required-features = ["takeover"]

[[bin]]
name = "takeover_demo_stock"
path = "src/bin/takeover_demo_stock.rs"
required-features = ["takeover"]

[[bin]]
name = "takeover_demo_nondet"
path = "src/bin/takeover_demo_nondet.rs"
required-features = ["takeover"]

[[bin]]
name = "takeover_demo_nondet_resource"
path = "src/bin/takeover_demo_nondet_resource.rs"
required-features = ["takeover"]

[[bin]]
name = "takeover_demo_unspawned"
path = "src/bin/takeover_demo_unspawned.rs"
required-features = ["takeover"]

[[bin]]
name = "takeover_demo_default"
path = "src/bin/takeover_demo_default.rs"
required-features = ["takeover"]

# Input-delivery regression demo: world moves only on
# `just_pressed` under a DefaultPlugins-equivalent graph (see
# tests/it/input_delivery.rs).
[[bin]]
name = "takeover_demo_input"
path = "src/bin/takeover_demo_input.rs"
required-features = ["takeover"]

# Picking-delivery regression demo: world moves only on
# `PointerClick` under a picking-capable graph (see
# tests/it/input_delivery.rs).
[[bin]]
name = "takeover_demo_picking"
path = "src/bin/takeover_demo_picking.rs"
required-features = ["takeover"]

# Minimal no-op child for probe-pool tests: runs, exits 0, never
# writes any file — the platform-neutral stand-in for "a game that
# exits without reporting" (see tests/it/probe_pool.rs,
# stale_report_cannot_masquerade_as_a_fresh_success).
[[bin]]
name = "takeover_demo_noop"
path = "src/bin/takeover_demo_noop.rs"
required-features = ["takeover"]

# Runaway child for probe-pool tests: never exits on its own — the
# watchdog-kills-a-stuck-game test needs a child GUARANTEED to still
# be alive at the 1s deadline on every machine (simulated-time demos
# are CPU-bound and machine-speed dependent; see the bin's module
# docs). See tests/it/probe_pool.rs:
# runaway_child_is_killed_by_the_wall_clock_watchdog.
[[bin]]
name = "takeover_demo_hang"
path = "src/bin/takeover_demo_hang.rs"
required-features = ["takeover"]

# Cwd/HOME-isolation child for probe-pool tests: writes one
# cwd-relative marker and one HOME-resolved marker, then exits —
# the regression test asserts both land in the pool's per-job
# throwaway directory. See tests/it/probe_pool.rs:
# probe_children_get_their_own_cwd_and_home.
[[bin]]
name = "takeover_demo_cwd_write"
path = "src/bin/takeover_demo_cwd_write.rs"
required-features = ["takeover"]

# Cwd/HOME-isolation child for the BATTERY's regression test: unlike
# the pool (whose workspace survives long enough to inspect), the
# battery's temp dir is RAII-removed before assertions run — so this
# child SELF-CHECKS its cwd and HOME (exit 0 = isolated, 2/3 =
# violation details on stderr) and the test asserts on the exit
# code. See tests/it/battery.rs:
# battery_child_runs_in_its_own_cwd_and_home.
[[bin]]
name = "takeover_demo_cwd_check"
path = "src/bin/takeover_demo_cwd_check.rs"
required-features = ["takeover"]

# GPU-panic crash child for the battery's diagnosis regression:
# prints bevy_render's exact GPU_NOT_FOUND_ERROR_MESSAGE (Linux arm,
# with the URL suffix) and exits 101 with no report — reproducing a
# GPU-less-host death WITHOUT a GPU-less host. See tests/it/battery.rs:
# gpu_panic_gets_named_failure_with_remediation.
[[bin]]
name = "takeover_demo_gpu_panic"
path = "src/bin/takeover_demo_gpu_panic.rs"
required-features = ["takeover"]

# Negative-control crash child for the battery's diagnosis
# regression: a GENERIC panic (no GPU marker substring) must keep
# the plain NoReport verdict — detection must never mask other
# failures. See tests/it/battery.rs:
# generic_panic_keeps_plain_no_report_failure.
[[bin]]
name = "takeover_demo_panic_generic"
path = "src/bin/takeover_demo_panic_generic.rs"
required-features = ["takeover"]

# Crash-member child for the seed-sweep gate tests: a real App run
# under takeover whose Update system panics, producing a Crash-status
# report (see tests/it/sweep.rs).
[[bin]]
name = "takeover_demo_crash"
path = "src/bin/takeover_demo_crash.rs"
required-features = ["takeover"]

# Grandchild-holding-pipe child for the battery's bounded-drain
# regression, TIMEOUT path: spawns a grandchild that INHERITS its
# stderr (the battery's tee pipe) and parks, then parks forever —
# the watchdog kills the direct child, but the parked grandchild
# keeps the pipe's write end open, so the tee never observes EOF.
# The drain must detach after its grace window instead of joining
# forever. See tests/it/battery.rs: bounded_drain_survives_a_held_pipe.
[[bin]]
name = "takeover_demo_stderr_grandchild"
path = "src/bin/takeover_demo_stderr_grandchild.rs"
required-features = ["takeover"]

# Same shape as takeover_demo_stderr_grandchild, NORMAL path: the
# direct child exits 101 promptly while the parked grandchild keeps
# the tee pipe open — the exit-diagnosis verdict must still arrive
# bounded. See tests/it/battery.rs:
# held_pipe_does_not_block_exit_diagnosis.
[[bin]]
name = "takeover_demo_stderr_grandchild_exit"
path = "src/bin/takeover_demo_stderr_grandchild_exit.rs"
required-features = ["takeover"]

[[bin]]
name = "takeover_demo_raw_winit"
path = "src/bin/takeover_demo_raw_winit.rs"
required-features = ["takeover"]

# Demo "game" for the mouse-MOTION probe tests: the canonical
# AccumulatedMouseMotion consumer (camera-pan idiom, signed delta).
# The motion probe's positive control — the probe MUST diverge on
# this game. See
# tests/it/probe_pool.rs: motion_probe_diverges_on_a_raw_motion_game.
[[bin]]
name = "takeover_demo_motion"
path = "src/bin/takeover_demo_motion.rs"
required-features = ["takeover"]

# Demo "game" for the FOCUS-WALK probe tests: the canonical
# tab-navigation consumer (TabNavigationPlugin + a TabGroup of
# TabIndexed widgets, digest-visibly reacting to focus movement).
# The walker's positive control — the probe MUST diverge on this
# game. See
# tests/it/probe_pool.rs: focus_walk_diverges_on_a_tab_navigation_game.
[[bin]]
name = "takeover_demo_focus"
path = "src/bin/takeover_demo_focus.rs"
required-features = ["takeover"]

[[bin]]
name = "takeover_demo_transient"
path = "src/bin/takeover_demo_transient.rs"
required-features = ["takeover"]

[[bin]]
name = "takeover_demo_empty"
path = "src/bin/takeover_demo_empty.rs"
required-features = ["takeover"]

# Demo whose world depends on OS randomness (getrandom()): positive
# control for the battery's deterministic-randomness shim.
[[bin]]
name = "takeover_demo_rng"
path = "src/bin/takeover_demo_rng.rs"
required-features = ["takeover"]

# Score a game's exploration against a committed targets file
# (eval/targets/*.json); used by the evaluation workflow.
[[bin]]
name = "bevy_playtest_eval"
path = "src/bin/bevy_playtest_eval.rs"
required-features = ["takeover"]

[features]
default = ["in-process", "takeover"]
in-process = []
takeover = ["in-process", "takeover-winit"]
takeover-winit = ["takeover", "dep:bevy_winit", "dep:bevy", "ui-liveness", "ui-surface"]
# UI liveness oracle: extends frozen_world to Changed<UiTransform>. Free
# under takeover (bevy meta-crate already unifies bevy_ui), so default-on
# there; in-process-only consumers opt in explicitly. `ui-surface` is
# default-on under takeover for the same reason (the bevy meta-crate's
# default `ui` feature already brings its crates): without it the bot
# cannot see a game's widgets and clicks purely at random.
ui-liveness = ["dep:bevy_ui"]

# Enumerate the declared UI/interactable surface (Pickable markers,
# bevy_ui_widgets markers, TabIndex, accessibility nodes, pointer
# observers) and attach it to the playtest report as `ui_surface`;
# the chaos mouse bot additionally targets enumerated widget centers
# ~50% of clicks (see src/discovery/ui_surface.rs and src/driver.rs).
# Chains `bevy_ui/bevy_picking`: best-label extraction reads
# AccessibleLabel, which lives behind bevy_ui's own bevy_picking
# feature. `bevy_ecs/serialize` + `bevy_math/serialize`: the result
# rides the serde'd PlaytestReport and serializes raw Entity/Vec2.
ui-surface = [
    "dep:bevy_ui",
    "dep:bevy_ui_widgets",
    "dep:bevy_picking",
    "dep:bevy_camera",
    "dep:bevy_input_focus",
    "dep:bevy_a11y",
    "bevy_ui/bevy_picking",
    "bevy_ecs/serialize",
    "bevy_math/serialize",
]

# Structural render-liveness rule (`render_liveness`,
# informational): verifies the GAME has a structurally live render
# path — at least one camera, not all disabled, output written to
# SOME target — during a sim-active run. Detects missing/inactive/
# Skip cameras; CANNOT see the render world or the GPU, so a live
# camera that renders black passes here (pixel checking is reserved
# for a future oracle). Attached only when a render sub-app EXISTS
# (`bevy_render::RenderApp` in the sub-app table): a headless
# server or unit-test app with no renderer is "not evaluated",
# never accused. Census-neutral by construction: the tracker is a
# driver-loop recorder (pure `fn(&World)` + one `App` sub-app
# lookup), never a registered system. `bevy_render` edge: zero new
# crates under takeover (unified by the `bevy` meta-crate);
# in-process-only consumers who opt in gain the renderer crate.
# See src/discovery/render_liveness.rs.
render-liveness = ["dep:bevy_camera", "dep:bevy_render"]

# Pixel-observed screen-liveness rule (`screen_liveness`,
# informational): the successor probe to `render_liveness` — instead
# of reading camera components, it captures what the renderer ACTUALLY
# produced: a harness-owned Camera2d renders the 2D scene into an
# offscreen Image and a per-cadence-tick GPU readback (bevy_render's
# screenshot wire) yields an 8x8 average-threshold perceptual hash;
# hashes that never change while the simulation reports activity are
# a frozen screen, hashes that do change prove pixels flowed. 2D
# first: purely-3D scenes (no Camera2d present) are honestly "not
# evaluated for 3d" — the rule never accuses what it cannot see.
# Captures drain through the game's own ScreenshotPlugin schedule;
# a post-run GPU wait-poll plus direct channel drain is the escape
# hatch. Census-neutral: probe camera + screenshot-request entities
# carry the `HarnessInjected` marker, excluded from the state digest
# and every breadth enumeration, and the render_liveness camera
# query ignores the probe. Extra deps beyond render-liveness:
# bevy_asset (Assets<Image>) + bevy_image (Image,
# RenderAssetUsages::RENDER_WORLD) — both already unified by the
# `bevy` meta-crate under takeover. See
# src/discovery/screen_liveness.rs.
screen-liveness = [
    "render-liveness",
    "dep:bevy_asset",
    "dep:bevy_image",
]

# Leafwing InputManager declared-binding reader + intent-tap
# (D1-d). Pure reflection: no leafwing dependency in this crate — the
# reader matches LW's registered type paths via AppTypeRegistry and
# walks InputMap/ActionState components reflectively (see
# src/discovery/lw.rs). OFF by default so the default build's
# dependency set is unchanged; ON in dev/test all-features runs and
# requested by the known_answer fixture's `playtest` feature.
lw-reader = []

# Local dev speedup: line-tables-only debuginfo (fast link, much
# smaller target/ — full debuginfo made each Bevy rlib 190-370 MB).
# CI already sets the same flag via RUSTFLAGS.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# No debuginfo for DEPENDENCIES (Bevy, wgpu, ...). Measured: a test
# binary was 409 MB of which only 40 MB was code; ~85% was Bevy's
# debug sections. Our own crate keeps line tables (the settings
# above), so backtraces through bevy_playtest still have line numbers.
# Smaller binaries = faster links, smaller target/ and CI cache.
[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false
